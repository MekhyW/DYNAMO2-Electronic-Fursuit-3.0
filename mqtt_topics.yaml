common_payloads:
  TelegramUser:
    type: object
    description: Context of the authenticated user performing the action.
    properties:
      id:
        type: integer
        description: Telegram User ID (0 if unauthenticated)
      first_name:
        type: string
        description: First name of the Telegram user ("Unauthenticated" if unauthenticated)

topics:
  # Topics used for command execution
  commands:
    - topic: dynamo/commands/play-sound-effect
      description: Plays a predefined sound effect on the device.
      payload:
        effectId:
          type: [integer, string]
          description: Unique identifier of the sound effect to be played.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/set-voice-effect
      description: Sets the active voice effect ID on the device.
      payload:
        effectId:
          type: integer
          description: Unique identifier of the voice effect.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/set-output-volume
      description: Sets the output audio volume.
      payload:
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Target output volume percentage.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/microphone-toggle
      description: Toggles the microphone state (enabled/disabled).
      payload:
        enabled:
          type: boolean
          description: Target state of the microphone.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/voice-changer-toggle
      description: Toggles the voice changer/manipulator effect.
      payload:
        enabled:
          type: boolean
          description: Target state of the voice changer.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/background-sound-toggle
      description: Toggles loop playback of background sounds.
      payload:
        enabled:
          type: boolean
          description: Target state of the background sound.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/leds-toggle
      description: Toggles the LED strip/lights on the device.
      payload:
        enabled:
          type: boolean
          description: Target state of LEDs.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/leds-brightness
      description: Sets the brightness level of the LEDs.
      payload:
        brightness:
          type: integer
          minimum: 0
          maximum: 100
          description: LED brightness percentage.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/eyes-brightness
      description: Sets the brightness level of the suit eyes display.
      payload:
        brightness:
          type: integer
          minimum: 0
          maximum: 100
          description: Eye display brightness percentage.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/leds-color
      description: Changes the LED color.
      payload:
        color:
          type: string
          description: Color value (hex representation or name).
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/leds-effect
      description: Sets the current light pattern or effect.
      payload:
        effect:
          type: string
          description: Name of the LED effect pattern (e.g. rainbow, breathing).
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/hotword-detection-toggle
      description: Toggles wake word detection listener on the suit.
      payload:
        enabled:
          type: boolean
          description: Target state of hotword detection.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/hotword-trigger
      description: Manually triggers the wake word event.
      payload:
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/text-to-speech
      description: Triggers TTS synthesis and speech playback on the device.
      payload:
        text:
          type: string
          description: Content to be spoken by the device.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/set-expression
      description: Sets the facial expression displayed on the suit eyes/screen.
      payload:
        expression:
          type: string
          description: Expression name (e.g. happy, sad, neutral).
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/face-expression-tracking-toggle
      description: Toggles expression tracking (using camera feedback to match expressions).
      payload:
        enabled:
          type: boolean
          description: Target state of expression tracking.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/eye-tracking-toggle
      description: Toggles look-at-target/eye tracking mode.
      payload:
        enabled:
          type: boolean
          description: Target state of eye tracking.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/motors-toggle
      description: Toggles the suit servo motors.
      payload:
        enabled:
          type: boolean
          description: Target power state of the motors.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/move-ear
      description: Moves the left ear servo, right ear servo, or both to a target position.
      payload:
        side:
          type: string
          enum: [left, right, both]
          description: Which ear(s) to move.
        position:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Normalised target position (0.0 = minimum angle, 1.0 = maximum angle).
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/move-eyebrow
      description: Moves the left eyebrow servo, right eyebrow servo, or both to a target position.
      payload:
        side:
          type: string
          enum: [left, right, both]
          description: Which eyebrow(s) to move.
        position:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Normalised target position (0.0 = minimum angle, 1.0 = maximum angle).
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/move-muzzle
      description: Moves the muzzle servo to a target position.
      payload:
        position:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Normalised target position (0.0 = fully closed, 1.0 = fully open).
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/set-pose
      description: Applies a full facial pose macro, setting all servo positions simultaneously.
      payload:
        expression:
          type: string
          description: Named pose macro to apply (e.g. happy, sad, angry, excited, surprised, tired, neutral).
          nullable: true
        scores:
          type: object
          description: Optional map of expression name to confidence score. The highest-scoring expression is applied.
          nullable: true
          additionalProperties:
            type: number
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/external-commands-lock
      description: Locks or unlocks external command processing.
      payload:
        locked:
          type: boolean
          description: Locked state.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/shutdown
      description: Initiates device shutdown.
      payload:
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/reboot
      description: Reboots the device hardware.
      payload:
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/kill-software
      description: Terminates the primary suit control daemon/software process.
      payload:
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/set-sound-device
      description: Sets the system input or output audio device.
      payload:
        deviceType:
          type: string
          enum: [input, output]
          description: Audio channel type.
        deviceName:
          type: string
          description: Name of the audio interface.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/telegram/send-text
      description: Sends a text message through the Telegram bot.
      payload:
        text:
          type: string
          description: Text message to send.
        user:
          $ref: '#/common_payloads/TelegramUser'

    - topic: dynamo/commands/telegram/send-media
      description: Sends a media message (picture, video, document) through the Telegram bot.
      payload:
        media_type:
          type: string
          enum: [picture, video, document]
          description: Type of media to send.
        media_url:
          type: string
          description: URL of the media to send.
        caption:
          type: string
          description: Caption for the media.
        user:
          $ref: '#/common_payloads/TelegramUser'


  # Topics used for retained data
  data:
    - topic: dynamo/data/sound_effects
      description: Stream of available sound effects configured on the suit.
      payload:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            filename:
              type: string
              nullable: true

    - topic: dynamo/data/voice_effects
      description: Stream of voice effects supported by the voice changer.
      payload:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            type:
              type: string

    - topic: dynamo/data/sound_devices
      description: List of detected audio hardware devices (input/output) on the system.
      payload:
        type: array
        items:
          type: string

    - topic: dynamo/data/eye-state
      description: Live eye-display state published by vision/control nodes and consumed by the Unity node.
      payload:
        type: object
        properties:
          displacement_x:
            type: number
            minimum: -1.0
            maximum: 1.0
            description: Horizontal eye displacement (negative = left, positive = right).
          displacement_y:
            type: number
            minimum: -1.0
            maximum: 1.0
            description: Vertical eye displacement (negative = down, positive = up).
          closeness_left:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Left eyelid closeness (0 = fully open, 1 = fully closed).
          closeness_right:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Right eyelid closeness (0 = fully open, 1 = fully closed).
          emotion_scores:
            type: array
            description: Ordered confidence scores for each expression (neutral, happy, sad, angry, excited, surprised).
            items:
              type: number
              minimum: 0.0
              maximum: 1.0
          silly_mode:
            type: boolean
            description: Whether silly mode is currently active.

    - topic: dynamo/data/bitmap
      description: Incoming bitmap data for status or rendering updates.
      payload:
        type: object
        properties:
          bitmap:
            type: string
            description: Base64 or binary string of the bitmap.

    - topic: dynamo/data/chat_logs
      description: Logs and transcripts of the voice/text interaction history.
      payload:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            content:
              type: string
            type:
              type: string
              enum: [prompt, response]
            timestamp:
              type: string
              format: date-time

    - topic: dynamo/data/lipsync
      description: Per-frame lip-sync analysis result published by the microphone node at ~62 Hz (every HOP=256 samples at 16 kHz). Silent/idle frames are throttled (published every 6th frame).
      payload:
        type: object
        properties:
          timestamp:
            type: number
            description: Unix epoch timestamp of the analysis frame.
          level:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Smoothed loudness level (log10-RMS mapped between VOL_MIN and VOL_MAX).
          raw_level:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Instantaneous (un-smoothed) loudness level.
          db:
            type: number
            description: Raw RMS level in dB.
          phoneme:
            type: [string, 'null']
            description: Top phoneme including non-vowels ('-' breath/noise, 'S' sibilant, 'N' nasal). Null when quiet.
          vowel:
            type: [string, 'null']
            description: Top phoneme only when it is a vowel (A/I/U/E/O); null otherwise.
          fit:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Cosine similarity of the best phoneme match. Low values indicate consonants or unseen sounds.
          weights:
            type: object
            description: Smoothed phoneme ratio map (phoneme name -> weight 0..1). Multiply by level for blendshape-style use.
            additionalProperties:
              type: number
          speaking:
            type: boolean
            description: Whether the speaker is currently considered to be speaking.

    - topic: dynamo/data/transcription_partial
      description: Partial (in-progress) transcription segment published by the WhisperLive client before the utterance is committed.
      payload:
        type: object
        properties:
          text:
            type: string
            description: Partial transcription text.
          timestamp:
            type: number
            description: Unix epoch timestamp when the partial was received.

    - topic: dynamo/data/transcription
      description: Committed (final) transcription of a spoken utterance published by the WhisperLive client.
      payload:
        type: object
        properties:
          text:
            type: string
            description: Transcribed text of the completed utterance.
          timestamp:
            type: number
            description: Unix epoch timestamp when the transcript was committed.
  

  # Current states of the suit components
  states:
    - topic: dynamo/state/servo
      description: Single servo update emitted whenever a servo or pose command is applied.
      payload:
        type: object
        properties:
          servo:
            type: string
            enum: [ear_left, ear_right, eyebrow_left, eyebrow_right, muzzle]
            description: Which servo was updated.
          angle:
            type: integer
            description: Angle in degrees derived from the normalized position.
          position:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Normalized position 0-1.

    - topic: dynamo/state/output-volume
      description: Current output audio volume level published by the Windows node.
      payload:
        type: object
        properties:
          volume:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Current output volume in normalized scalar form.

    - topic: dynamo/state/handheld-input
      description: Handheld input events published by the handheld node.
      payload:
        type: object
        properties:
          type:
            type: string
            description: Type of input event (tap, hold, combo).
          key:
            type: string
            description: Which key was pressed (left, right, up, down, enter).
          held:
            type: boolean
            description: Whether the key is held (for hold events only).
          timestamp:
            type: number
            description: Timestamp of the event.


  # Camera streams and vision analysis
  camera:
    - topic: dynamo/camera/raw
      description: JPEG-encoded frame captured from the external camera.
      payload:
        type: object
        properties:
          timestamp:
            type: number
            description: Unix epoch timestamp of the captured frame.
          width:
            type: integer
            description: Frame width in pixels.
          height:
            type: integer
            description: Frame height in pixels.
          data:
            type: string
            description: Base64-encoded JPEG bytes.

    - topic: dynamo/camera/detection
      description: Per-frame fursuit and human detections with persistent ByteTrack IDs.
      payload:
        type: object
        properties:
          timestamp:
            type: number
            description: Unix epoch timestamp of the inference frame.
          frame:
            type: integer
            description: Monotonic frame number since node startup.
          backend:
            type: string
            enum: [openvino]
            description: Inference backend used by the detector.
          detections:
            type: array
            items:
              type: object
              properties:
                bbox:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    type: number
                  description: Pixel coordinates [x1, y1, x2, y2].
                confidence:
                  type: [number, 'null']
                  minimum: 0.0
                  maximum: 1.0
                  description: Detector confidence score.
                class_id:
                  type: integer
                  description: Model class index.
                label:
                  type: string
                  description: Human-readable model class label.
                track_id:
                  type: [integer, 'null']
                  description: Persistent ByteTrack identifier, when assigned.

    - topic: dynamo/camera/lighting
      description: Per-frame estimate of environmental lighting from image luminance.
      payload:
        type: object
        properties:
          timestamp:
            type: number
            description: Unix epoch timestamp of the analyzed frame.
          brightness:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Normalized perceptual scene brightness.
          mean_luminance:
            type: number
            minimum: 0.0
            maximum: 1.0
            description: Normalized mean frame luminance.


  # Current status of nodes
  status:
    - topic: dynamo/status/actuators
      description: Heartbeat status published by the actuators node.
      payload:
        type: object
        properties:
          status:
            type: string
            enum: [online, offline]
            description: Current node availability state.
          node:
            type: string
            description: Name of the publishing node.

    - topic: dynamo/status/windows
      description: Periodic system status update published by the Windows node.
      payload:
        type: object
        properties:
          node:
            type: string
            description: Name of the publishing node.
          platform:
            type: string
            description: Platform identifier such as win32 or linux.
          cpu:
            type: object
            properties:
              physical_cores:
                type: integer
                description: Number of physical CPU cores.
              total_cores:
                type: integer
                description: Total number of CPU cores (including logical).
              usage:
                type: number
                description: Current CPU usage percentage.
          memory:
            type: object
            properties:
              total:
                type: integer
                description: Total system memory in bytes.
              available:
                type: integer
                description: Available system memory in bytes.
              used:
                type: integer
                description: Used system memory in bytes.
              percent:
                type: number
                description: Memory usage percentage.
          disk:
            type: object
            properties:
              total:
                type: integer
                description: Total disk space in bytes.
              used:
                type: integer
                description: Used disk space in bytes.
              free:
                type: integer
                description: Free disk space in bytes.
              percent:
                type: number
                description: Disk usage percentage.
    
    - topic: dynamo/status/telegram
      description: Periodic system status update published by the Telegram node.
      payload:
        type: object
        properties:
          node:
            type: string
            description: Name of the publishing node.
          status:
            type: string
            description: Status of the node.

    - topic: dynamo/status/unity
      description: Heartbeat status published by the Unity node.
      payload:
        type: object
        properties:
          status:
            type: string
            enum: [online, offline]
            description: Current node availability state.
          node:
            type: string
            description: Name of the publishing node.

    - topic: dynamo/status/microphone
      description: Heartbeat status published by the microphone node every STATUS_PUBLISH_INTERVAL (5 s). An offline payload is sent once on shutdown.
      payload:
        type: object
        properties:
          status:
            type: string
            enum: [online, offline]
            description: Current node availability state.
          node:
            type: string
            description: Name of the publishing node (always "microphone").
          adapt_offset:
            type: number
            description: L2 norm of the current channel-adapter MFCC offset (indicates how much mic-response correction has accumulated). Only present when status is online.
          dropped_blocks:
            type: object
            description: Counts of audio blocks dropped due to full queues since startup. Only present when status is online.
            properties:
              fast:
                type: integer
                description: Blocks dropped from the lip-sync (fast) path.
              slow:
                type: integer
                description: Blocks dropped from the WhisperLive (slow) path.
          audio_xruns:
            type: integer
            description: Cumulative number of PortAudio under/overruns since startup. Only present when status is online.

    - topic: dynamo/status/vision
      description: Camera vision node heartbeat and runtime information.
      payload:
        type: object
        properties:
          status:
            type: string
            enum: [online, offline]
            description: Current camera node availability state.
          node:
            type: string
            description: Name of the publishing node (always "vision").
          camera:
            type: string
            description: Camera device index or source used by the node.
          frames:
            type: integer
            description: Number of frames processed since startup.
          fps:
            type: number
            description: Average processed frames per second while online.
          error:
            type: string
            description: Most recent camera or inference error, when present.


  # Other topics
  other:
    - topic: mekhy/app/lock
      description: Synchronizes app lock/restricted status state.
      payload:
        type: object
        description: System/app lock state.

    - topic: dynamo/spotify
      description: Receives Spotify play, pause, or search actions to trigger internal Spotify API client hooks.
      payload:
        type: object
        properties:
          action:
            type: string
            enum: [search_and_play, play, pause]
          query:
            type: string
            description: Optional query used when action is 'search_and_play'.
          uris:
            type: array
            items:
              type: string
            description: Optional track URIs to play.
          device_id:
            type: string
            description: Optional target device ID.

    - topic: dynamo/eyes-video
      description: Sends a video URL to play on the eyes display.
      payload:
        url:
          type: string
          description: URL of the video file to be rendered.
        user:
          $ref: '#/common_payloads/TelegramUser'
